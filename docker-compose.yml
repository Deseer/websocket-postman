services:
  ws-dispatcher:
    build: .
    container_name: ws-dispatcher
    restart: unless-stopped
    ports:
      - "${POSTMAN_WEBUI_PORT:-7200}:8080" # WebUI
      - "${POSTMAN_WS_PORT:-8766}:8765" # NapCat WS 连接端口（避开 Tavern OneBot 的 8765）
    volumes:
      # 持久化配置和数据
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
      - ./src:/app/src # 挂载源码，方便热更新
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
